
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIRKA CASINO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#3b270d,#0b0804 55%);color:#fff5df;font:15px Arial,sans-serif}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{padding:18px;background:#0d0905;border-right:1px solid #674b1b}
.logo{text-align:center;color:#ffd76a;font-size:24px;font-weight:900;margin-bottom:15px}
.profile,.card,.item{background:#171006;border:1px solid #5c431a;border-radius:16px;padding:15px}
.profile{text-align:center}
.avatar{font-size:34px}
.bal{font-size:21px;color:#ffd76a;font-weight:900;margin:6px 0}
.xp{height:8px;background:#080604;border-radius:9px;overflow:hidden;margin:8px 0}
.xp i{display:block;height:100%;background:#eab94e;width:0;transition:width .25s}
.nav{display:grid;gap:7px;margin-top:12px}
.btn,.mode{border:1px solid #5c431a;background:#1b1208;color:#fff5df;border-radius:10px;padding:10px;cursor:pointer}
.btn:hover,.mode:hover,.active{border-color:#ffd76a;background:#2b1c0b}
.btn:disabled{opacity:.5;cursor:not-allowed}
.play{width:100%;margin:12px 0;background:linear-gradient(135deg,#b77b1e,#ffe080);color:#211300;font-size:20px;font-weight:900}
main{padding:22px;max-width:1450px;width:100%;margin:auto}
.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:15px}
.title{font-size:27px;font-weight:900}
.muted{color:#bcae96}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:15px}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}
.reel{height:145px;display:grid;place-items:center;font-size:62px;border:2px solid #866222;border-radius:18px;background:#0c0804;box-shadow:inset 0 0 30px #000}
.reel.spinning{animation:shake .08s linear infinite}
@keyframes shake{50%{transform:translateY(5px)}}
.result{text-align:center;min-height:30px;color:#ffe49b;font-weight:900;font-size:18px}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.big{min-width:220px;font-size:21px;font-weight:900;background:linear-gradient(135deg,#b77b1e,#ffe080);color:#211300;border:0}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stats,.features{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat,.feature{background:#100b06;border:1px solid #3d2c13;border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;color:#ffd76a;font-size:17px}
.feature{text-align:left;cursor:pointer}
.history{max-height:220px;overflow:auto}
.history div{padding:7px;border-bottom:1px solid #2c210f}
.overlay{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;padding:20px;z-index:5}
.modal{max-width:800px;width:100%;max-height:85vh;overflow:auto;background:#140d06;border:1px solid #806022;border-radius:18px;padding:20px}
.modalhead{display:flex;justify-content:space-between;align-items:center}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.toast{display:none;position:fixed;right:20px;bottom:20px;padding:12px 16px;background:#201507;border:1px solid #ffd76a;border-radius:10px;z-index:9}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative}.grid{grid-template-columns:1fr}}
@media(max-width:600px){main{padding:12px}.reel{height:100px;font-size:42px}.stats,.features{grid-template-columns:repeat(2,1fr)}.items{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="logo">💰 KIRKA CASINO</div>
  <div class="profile">
    <div class="avatar">😎</div>
    <b>Кирка</b>
    <div class="bal" id="bal"></div>
    <div class="muted">Lv.<span id="lvl"></span> • <span id="title"></span></div>
    <div class="xp"><i id="xpbar"></i></div>
    <div class="muted">XP <span id="xp"></span>/800 • Комбо ×<span id="combo"></span><br>🐺 Волк Lv.<span id="pet"></span></div>
  </div>
  <button class="btn play" id="playBtn">🎰 ИГРАТЬ</button>
  <div class="nav">
    <button class="btn" data-page="shop">🛒 Магазин</button>
    <button class="btn" data-page="quests">🎯 Задания</button>
    <button class="btn" data-page="inventory">🎒 Инвентарь</button>
    <button class="btn" data-page="ach">🏆 Достижения</button>
    <button class="btn" data-page="titles">👑 Титулы</button>
    <button class="btn" data-page="pets">🐾 Питомцы</button>
    <button class="btn" data-page="profile">👤 Профиль</button>
  </div>
</aside>

<main>

    <div>
